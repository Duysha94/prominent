<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AK Brand Development Studio — Fashion &amp; Brand Advisory</title>
    <meta
      name="description"
      content="We take fashion brands from a point of view to a paying customer — advisory, identity, the store that sells it, and the media that fills it."
    />
    <meta name="theme-color" content="#100d0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f9f6f2" media="(prefers-color-scheme: light)" />

    <!--
      Theme is resolved BEFORE first paint. A dark-mode site that flashes white
      is called out as a straight UX failure, and it is entirely avoidable: this
      runs synchronously in <head>, ahead of any stylesheet paint.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ak-theme')
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>

    <!--
      Fonts are self-hosted and subset (see base.css). Only the two faces that
      paint above the fold are preloaded; Martian Mono arrives with the rest of
      the CSS because nothing in the first viewport is set in it.
    -->
    <link rel="preload" href="/fonts/fraunces-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
